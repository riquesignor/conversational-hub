name: Secret scanning (gitleaks)

# Rede de segurança contínua: roda em todo push e PR pra pegar qualquer
# segredo (API key, chave privada, credencial) commitado por engano DEPOIS
# que o repo virar público. Não substitui o cuidado normal com .gitignore —
# é a última linha de defesa.
#
# Falha o job (e bloqueia o PR/push, se branch protection estiver ativa em
# Settings → Branches) se encontrar algo que bata com os padrões conhecidos
# de segredo. Zero configuração adicional necessária: a action já vem com
# um conjunto de regras cobrindo os formatos mais comuns (Google API key,
# chaves privadas PEM, tokens OpenAI/AWS/etc.).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
