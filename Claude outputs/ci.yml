name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela um run em andamento se um push novo chegar na mesma branch/PR —
# evita gastar minutos de Actions rodando CI de um commit já obsoleto.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes de unidade
        run: npm test

      # Roda o build de produção de verdade (não só tsc) SEM nenhuma env var
      # de Firebase configurada — é exatamente o cenário que já quebrou o
      # deploy na Vercel uma vez neste projeto (auth/invalid-api-key
      # estourando durante o prerender estático). Ver README, "Autenticação
      # e Firestore" — isto existe especificamente pra nunca deixar esse
      # tipo de regressão passar batido de novo antes de chegar em produção.
      - name: Build de produção (sem env vars do Firebase — smoke test do fix de lazy-init)
        run: npm run build

      - name: Instalar browsers do Playwright
        run: npx playwright install --with-deps chromium

      - name: Testes e2e (smoke)
        run: npm run test:e2e

      - name: Upload do relatório do Playwright (só se algo falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
